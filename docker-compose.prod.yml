services:
  spreadsheet-manager:
    build: .
    container_name: spreadsheet-manager
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /app/data/spreadsheet-manager:/data
    env_file:
      - /app/data/spreadsheet-manager/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
